<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="850" fill="#f4f7f9" />

  <!-- Header -->
  <rect width="1200" height="60" fill="#1e293b" />
  <text x="30" y="38" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Graph RAG vs PageRank : Educational Evaluator</text>
  <rect x="1050" y="15" width="120" height="30" rx="5" fill="#3b82f6" />
  <text x="1075" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Demo Data ▼</text>

  <!-- ================= LEFT PANEL (GRAPH VISUALIZATION) ================= -->
  <rect x="20" y="80" width="680" height="480" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="40" y="115" fill="#334155" font-family="sans-serif" font-size="18" font-weight="bold">Network Visualization (Cytoscape.js)</text>
  <rect x="520" y="95" width="160" height="30" rx="15" fill="#fef08a" opacity="0.6"/>
  <text x="535" y="115" fill="#854d0e" font-family="sans-serif" font-size="12" font-weight="bold">View: HYBRID MODEL</text>

  <!-- Edges (Lines) -->
  <line x1="340" y1="280" x2="160" y2="180" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="160" y1="380" x2="160" y2="180" stroke="#cbd5e1" stroke-width="3" />
  <line x1="520" y1="360" x2="160" y2="180" stroke="#cbd5e1" stroke-width="1" />
  <line x1="340" y1="280" x2="160" y2="380" stroke="#cbd5e1" stroke-width="2" />
  <line x1="520" y1="200" x2="340" y2="280" stroke="#cbd5e1" stroke-width="2" />
  <line x1="340" y1="440" x2="340" y2="280" stroke="#cbd5e1" stroke-width="2" />

  <!-- Nodes -->
  <!-- Node 1 (PageRank Winner - Blue, Big) -->
  <circle cx="160" cy="180" r="50" fill="#bfdbfe" stroke="#3b82f6" stroke-width="4" />
  <text x="135" y="175" fill="#1e3a8a" font-family="sans-serif" font-size="14" font-weight="bold">Node 1</text>
  <text x="130" y="195" fill="#1e3a8a" font-family="sans-serif" font-size="11">(Turing)</text>

  <!-- Node 3 (RAG Winner - Red, Medium) -->
  <circle cx="520" cy="200" r="35" fill="#fecaca" stroke="#ef4444" stroke-width="4" />
  <text x="495" y="195" fill="#7f1d1d" font-family="sans-serif" font-size="14" font-weight="bold">Node 3</text>
  <text x="500" y="210" fill="#7f1d1d" font-family="sans-serif" font-size="11">(Spam)</text>

  <!-- Node 4 (Hybrid Winner - Gold/Green, Highlighted) -->
  <circle cx="340" cy="280" r="60" fill="#fef08a" stroke="#eab308" stroke-width="6" />
  <text x="310" y="275" fill="#713f12" font-family="sans-serif" font-size="16" font-weight="bold">Node 4</text>
  <text x="290" y="295" fill="#713f12" font-family="sans-serif" font-size="12">"Attention Is All..."</text>

  <!-- Other Nodes -->
  <circle cx="160" cy="380" r="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <text x="140" y="385" fill="#475569" font-family="sans-serif" font-size="12">Node 2</text>
  
  <circle cx="520" cy="360" r="25" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <text x="502" y="364" fill="#475569" font-family="sans-serif" font-size="12">Node 5</text>
  
  <circle cx="340" cy="440" r="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <text x="322" y="444" fill="#475569" font-family="sans-serif" font-size="12">Node 6</text>


  <!-- ================= RIGHT PANEL (CONTROLS & LEADERBOARD) ================= -->
  <rect x="720" y="80" width="460" height="480" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Search Area -->
  <text x="740" y="115" fill="#334155" font-family="sans-serif" font-size="16" font-weight="bold">User Query:</text>
  <rect x="740" y="130" width="420" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="750" y="155" fill="#0f172a" font-family="sans-serif" font-size="14">What is the role of Transformers in NLP?</text>
  <rect x="1060" y="135" width="90" height="30" rx="5" fill="#10b981" />
  <text x="1080" y="155" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Run ►</text>

  <!-- Algorithm Selection -->
  <text x="740" y="210" fill="#334155" font-family="sans-serif" font-size="16" font-weight="bold">Select Retrieval Algorithm:</text>
  <circle cx="750" cy="240" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="770" y="245" fill="#475569" font-family="sans-serif" font-size="14">1. PageRank (Authority Only)</text>

  <circle cx="750" cy="270" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="770" y="275" fill="#475569" font-family="sans-serif" font-size="14">2. Vector Search / RAG (Relevance Only)</text>

  <circle cx="750" cy="300" r="8" fill="#3b82f6" />
  <circle cx="750" cy="300" r="3" fill="#ffffff" />
  <text x="770" y="305" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">3. Graph RAG Hybrid (Authority + Relevance)</text>

  <!-- Leaderboard Table -->
  <text x="740" y="360" fill="#334155" font-family="sans-serif" font-size="16" font-weight="bold">Calculated Metrics (Backend):</text>
  <rect x="740" y="375" width="420" height="150" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  
  <text x="750" y="400" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">RANK</text>
  <text x="810" y="400" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">NODE</text>
  <text x="910" y="400" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">PR SCORE</text>
  <text x="990" y="400" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">RAG SCORE</text>
  <text x="1080" y="400" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">HYBRID</text>
  <line x1="740" y1="410" x2="1160" y2="410" stroke="#cbd5e1" stroke-width="1" />

  <rect x="740" y="415" width="420" height="25" fill="#fef08a" opacity="0.4" />
  <text x="760" y="432" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">1</text>
  <text x="810" y="432" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Node 4</text>
  <text x="920" y="432" fill="#0f172a" font-family="sans-serif" font-size="13">0.75</text>
  <text x="1000" y="432" fill="#0f172a" font-family="sans-serif" font-size="13">0.96</text>
  <text x="1090" y="432" fill="#15803d" font-family="sans-serif" font-size="13" font-weight="bold">0.85</text>

  <text x="760" y="462" fill="#475569" font-family="sans-serif" font-size="13">2</text>
  <text x="810" y="462" fill="#475569" font-family="sans-serif" font-size="13">Node 3 (Spam)</text>
  <text x="920" y="462" fill="#475569" font-family="sans-serif" font-size="13">0.00</text>
  <text x="1000" y="462" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="bold">0.98</text>
  <text x="1090" y="462" fill="#475569" font-family="sans-serif" font-size="13">0.49</text>

  <text x="760" y="492" fill="#475569" font-family="sans-serif" font-size="13">3</text>
  <text x="810" y="492" fill="#475569" font-family="sans-serif" font-size="13">Node 1 (Turing)</text>
  <text x="920" y="492" fill="#3b82f6" font-family="sans-serif" font-size="13" font-weight="bold">1.00</text>
  <text x="1000" y="492" fill="#475569" font-family="sans-serif" font-size="13">0.12</text>
  <text x="1090" y="492" fill="#475569" font-family="sans-serif" font-size="13">0.45</text>

  <!-- ================= BOTTOM PANEL (LLM COMPARISON) ================= -->
  <!-- Strict PageRank LLM Output -->
  <rect x="20" y="580" width="560" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="580" width="560" height="40" rx="10" fill="#f1f5f9" />
  <text x="40" y="605" fill="#334155" font-family="sans-serif" font-size="16" font-weight="bold">❌ LLM Output (Based on PageRank Context)</text>
  <text x="40" y="640" fill="#64748b" font-family="sans-serif" font-size="13">Retrieval Source: Node 1 (Highest Authority - Score 1.00)</text>
  <text x="40" y="680" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">"Based strictly on the provided text, I cannot</text>
  <text x="40" y="705" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">answer what role Transformers play in NLP. The</text>
  <text x="40" y="730" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">text only discusses whether machines can think</text>
  <text x="40" y="755" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">and the imitation game."</text>
  <text x="40" y="790" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="bold">Analysis: Failed. Document is authoritative but irrelevant.</text>

  <!-- Hybrid/RAG LLM Output -->
  <rect x="620" y="580" width="560" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="620" y="580" width="560" height="40" rx="10" fill="#ecfdf5" />
  <text x="640" y="605" fill="#065f46" font-family="sans-serif" font-size="16" font-weight="bold">✅ LLM Output (Based on Hybrid RAG Context)</text>
  <text x="640" y="640" fill="#64748b" font-family="sans-serif" font-size="13">Retrieval Source: Node 4 (Highest Hybrid - Score 0.85)</text>
  <text x="640" y="680" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">"According to the provided text, Transformers are</text>
  <text x="640" y="705" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">a new neural network architecture for NLP that</text>
  <text x="640" y="730" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">dispenses with recurrence and relies entirely on</text>
  <text x="640" y="755" fill="#0f172a" font-family="sans-serif" font-size="15" font-style="italic">the attention mechanism."</text>
  <text x="640" y="790" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">Analysis: Success. Filtered out spam, found relevant context.</text>
</svg>